name: Footage selector tests

on:
  push:
    branches:
      - upgrade/credible-footage-chunk-engine-20261020
  pull_request:
    branches:
      - upgrade/cinematic-pipeline-20261009

jobs:
  selector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-selection regression tests
        run: python -m unittest discover -s tests -p "test_credible_footage.py" -v
